<script>

/* ==============================

const SUPABASE_URL =
  "https://nieyajttmfkxowwjqglb.supabase.co";


const SUPABASE_KEY =

const supabaseClient =

    SUPABASE_URL,

  );


/* ==============================
   VARIABILI
============================== */

let selectedPerson =
  "Matteo";

let selectedDate =
  null;

let selectedTime =
  null;

let dayOffset =
  0;


/* ==============================
   ORARI
============================== */

const TIMES = [

  "09:00",
  "09:30",
  "10:00",
  "10:30",
  "11:00",
  "11:30",
  "12:00",

  "14:00",
  "14:30",
  "15:00",
  "15:30",
  "16:00",
  "16:30",
  "17:00",
  "17:30",
  "18:00",
  "18:30",
  "19:00"

];


/* ==============================
   ELEMENTI
============================== */

const daysContainer =
  document.getElementById(
    "days"
  );

const timesContainer =
  document.getElementById(
    "times"
  );

const timeInfo =
  document.getElementById(
    "timeInfo"
  );

const bookButton =
  document.getElementById(
    "bookButton"
  );

const message =
  document.getElementById(
    "message"
  );

const nameInput =
  document.getElementById(
    "name"
  );


/* ==============================
   DATA
============================== */

function dateString(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );

  return `${year}-${month}-${day}`;

}


/* ==============================
   GIORNI
============================== */

function renderDays(){

  daysContainer.innerHTML =
    "";

  const today =
    new Date();

  today.setHours(
    0,
    0,
    0,
    0
  );


  for(
    let i = 0;
    i < 7;
    i++
  ){

    const date =
      new Date(
        today
      );

    date.setDate(
      today.getDate()
      +
      dayOffset
      +
      i
    );


    const dateValue =
      dateString(
        date
      );


    const day =
      document.createElement(
        "div"
      );


    day.className =
      "day";


    if(
      selectedDate ===
      dateValue
    ){

      day.classList.add(
        "selected"
      );

    }


    const dayName =
      new Intl.DateTimeFormat(
        "it-IT",
        {
          weekday:
            "short"
        }
      ).format(
        date
      );


    const month =
      new Intl.DateTimeFormat(
        "it-IT",
        {
          month:
            "short"
        }
      ).format(
        date
      );


    const isToday =
      i === 0 &&
      dayOffset === 0;


    day.innerHTML = `

      <div class="day-name">

        ${
          isToday
            ? "OGGI"
            : dayName
        }

      </div>

      <div class="day-number">

        ${date.getDate()}

      </div>

      <div class="day-month">

        ${month}

      </div>

    `;


    day.addEventListener(
      "click",
      () => {

        selectedDate =
          dateValue;

        selectedTime =
          null;

        renderDays();

        loadTimes();

      }
    );


    daysContainer.appendChild(
      day
    );

  }

}


/* ==============================
   FRECCIA INDIETRO
============================== */

document
  .getElementById(
    "prevDays"
  )
  .addEventListener(
    "click",
    () => {

      if(
        dayOffset > 0
      ){

        dayOffset--;

        renderDays();

      }

    }
  );


/* ==============================
   FRECCIA AVANTI
============================== */

document
  .getElementById(
    "nextDays"
  )
  .addEventListener(
    "click",
    () => {

      dayOffset++;

      renderDays();

    }
  );


/* ==============================
   BARBIERI
============================== */

document
  .querySelectorAll(
    ".person"
  )
  .forEach(
    person => {

      person.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".person"
            )
            .forEach(
              p =>
                p.classList.remove(
                  "selected"
                )
            );


          person.classList.add(
            "selected"
          );


          selectedPerson =
            person.dataset.person;


          selectedTime =
            null;


          loadTimes();

        }
      );

    }
  );


/* ==============================
   CARICA ORARI
============================== */

async function loadTimes(){

  timesContainer.innerHTML =
    "";

  selectedTime =
    null;

  bookButton.disabled =
    true;


  if(
    !selectedDate
  ){

    timeInfo.textContent =
      "Scegli un giorno.";

    return;

  }


  timeInfo.className =
    "info";

  timeInfo.textContent =
    "Controllo disponibilità...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_booked_slots",
        {

          p_persona:
            selectedPerson,

          p_data:
            selectedDate

        }
      );


    if(error){

      console.error(
        error
      );

      timeInfo.className =
        "info error";

      timeInfo.textContent =
        "Errore nel caricamento degli orari.";

      return;

    }


    const occupied =
      (
        data || []
      ).map(
        item =>
          String(
            item.orario
          ).substring(
            0,
            5
          )
      );


    TIMES.forEach(
      time => {

        const button =
          document.createElement(
            "div"
          );

        button.className =
          "time";

        button.textContent =
          time;


        if(
          occupied.includes(
            time
          )
        ){

          button.classList.add(
            "occupied"
          );

          button.textContent =
            time +
            " • occupato";

        }
        else{

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".time"
                )
                .forEach(
                  t =>
                    t.classList.remove(
                      "selected"
                    )
                );


              button.classList.add(
                "selected"
              );


              selectedTime =
                time;


              bookButton.disabled =
                false;

            }
          );

        }


        timesContainer.appendChild(
          button
        );

      }
    );


    const available =
      TIMES.filter(
        time =>
          !occupied.includes(
            time
          )
      );


    if(
      available.length === 0
    ){

      timeInfo.className =
        "info error";

      timeInfo.textContent =
        "Nessun orario disponibile.";

    }
    else{

      timeInfo.className =
        "info";

      timeInfo.textContent =
        "Scegli l'orario che preferisci.";

    }


  }
  catch(error){

    console.error(
      error
    );

    timeInfo.className =
      "info error";

    timeInfo.textContent =
      "Errore di connessione.";

  }

}


/* ==============================
   PRENOTAZIONE
============================== */

bookButton.addEventListener(
  "click",
  async () => {

    const name =
      nameInput.value.trim();


    if(
      !name
    ){

      message.className =
        "message error";

      message.textContent =
        "Inserisci il tuo nome.";

      nameInput.focus();

      return;

    }


    if(
      !selectedDate
    ){

      message.className =
        "message error";

      message.textContent =
        "Scegli un giorno.";

      return;

    }


    if(
      !selectedTime
    ){

      message.className =
        "message error";

      message.textContent =
        "Scegli un orario.";

      return;

    }


    bookButton.disabled =
      true;


    message.className =
      "message";


    message.textContent =
      "Prenotazione in corso...";


    const {
      error
    } =
      await supabaseClient
        .from(
          "prenotazioni"
        )
        .insert({

          nome:
            name,

          persona:
            selectedPerson,

          data:
            selectedDate,

          orario:
            selectedTime

        });


    if(error){

      console.error(
        error
      );

      message.className =
        "message error";


      if(
        error.code ===
        "23505"
      ){

        message.textContent =
          "❌ Questo orario è appena stato prenotato.";

      }
      else{

        message.textContent =
          "❌ Errore. Riprova.";

      }


      loadTimes();

      return;

    }


    /* ==========================
       PRENOTAZIONE CONFERMATA
    ========================== */

    const formattedDate =
      new Date(
        selectedDate +
        "T00:00:00"
      )
      .toLocaleDateString(
        "it-IT",
        {

          weekday:
            "long",

          day:
            "numeric",

          month:
            "long",

          year:
            "numeric"

        }
      );


    const whatsappNumber =

      selectedPerson ===
      "Matteo"

      ?

      "393201519469"

      :

      "393274454796";


    const whatsappMessage =

      `Ciao! Sono ${name}, ` +

      `ho appena prenotato ` +

      `un appuntamento da ` +

      `𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹.` +

      `\n\n` +

      `✂️ Barbiere: ` +

      `${selectedPerson}` +

      `\n` +

      `📅 ${formattedDate}` +

      `\n` +

      `🕐 Ore ${selectedTime}`;


    const whatsappLink =

      "https://wa.me/" +

      whatsappNumber +

      "?text=" +

      encodeURIComponent(
        whatsappMessage
      );


    message.className =
      "message success";


    message.innerHTML = `

      <div class="confirmation">

        <div class="confirmation-title">

          ✅ PRENOTAZIONE CONFERMATA

        </div>


        <div class="confirmation-details">

          ✂️ Barbiere:

          <strong>
            ${selectedPerson}
          </strong>

          <br>

          📅 Giorno:

          <strong>
            ${formattedDate}
          </strong>

          <br>

          🕐 Orario:

          <strong>
            ${selectedTime}
          </strong>

          <br>

          👤 Nome:

          <strong>
            ${name}
          </strong>

        </div>


        <a
          href="${whatsappLink}"
          target="_blank"
          class="whatsapp-button"
          rel="noopener"
        >

          📱 CONFERMA SU WHATSAPP

        </a>

      </div>

    `;


    nameInput.value =
      "";

    selectedTime =
      null;

    loadTimes();

  }
);


/* ==============================
   AVVIO
============================== */

const today =
  new Date();


selectedDate =
  dateString(
    today
  );


renderDays();


loadTimes();

</script>
