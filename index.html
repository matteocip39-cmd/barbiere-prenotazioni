<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prenota il tuo barbiere</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1ec;
      color: #211d19;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 45px;
    }

    h1 {
      margin: 8px 0;
    }

    .subtitle {
      color: #706960;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #d5cec5;
      border-radius: 10px;
      font-size: 16px;
    }

    .people {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .person {
      padding: 16px;
      border: 2px solid #ddd6ce;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }

    .person.selected {
      border-color: #211d19;
      background: #eee9e3;
    }

    .person input {
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      background: #211d19;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: #26723a;
    }

    .error {
      color: #a32e27;
    }

    .booking {
      padding: 13px;
      border: 1px solid #ddd6ce;
      border-radius: 12px;
      margin: 10px 0;
    }

    .muted {
      color: #706960;
      font-size: 14px;
    }

    @media(max-width:500px) {
      .people {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">✂️</div>

    <h1>Prenota il tuo barbiere</h1>

    <p class="subtitle">
      Scegli il barbiere, il giorno e l'orario.
    </p>
  </header>

  <div class="card">

    <form id="bookingForm">

      <label>Il tuo nome</label>

      <input
        id="name"
        type="text"
        maxlength="80"
        placeholder="Nome e cognome"
        required
      >

      <label>Scegli il barbiere</label>

      <div class="people">

        <label class="person selected">
          <input
            type="radio"
            name="person"
            value="Matteo"
            checked
          >
          Matteo
        </label>

        <label class="person">
          <input
            type="radio"
            name="person"
            value="Tommaso"
          >
          Tommaso
        </label>

      </div>

      <label>Data</label>

      <input
        id="date"
        type="date"
        required
      >

      <label>Orario</label>

      <input
        id="time"
        type="time"
        required
      >

      <button id="submitButton" type="submit">
        PRENOTA
      </button>

      <div id="message"></div>

    </form>

  </div>

  <div class="card">

    <h2>Ultime prenotazioni</h2>

    <div id="bookings">
      Caricamento...
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://nieyajttmfkxowwjqglb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9ShmvYVhOPGoU90-Lkwdvw_BVy3dz_X";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* Selezione Matteo / Tommaso */

document.querySelectorAll(".person").forEach(person => {

  person.addEventListener("click", () => {

    document.querySelectorAll(".person")
      .forEach(p => p.classList.remove("selected"));

    person.classList.add("selected");

  });

});


/* Data minima = oggi */

document.getElementById("date").min =
  new Date().toISOString().split("T")[0];


/* Carica prenotazioni */

async function loadBookings() {

  const bookings =
    document.getElementById("bookings");

  const { data, error } =
    await supabaseClient
      .from("prenotazioni")
      .select("nome, persona, data, orario")
      .order("data", { ascending: true })
      .order("orario", { ascending: true });

  if (error) {

    bookings.innerHTML =
      "<p class='error'>Errore nel caricamento delle prenotazioni.</p>";

    console.error(error);

    return;
  }

  if (!data || data.length === 0) {

    bookings.innerHTML =
      "<p class='muted'>Nessuna prenotazione.</p>";

    return;
  }

  bookings.innerHTML = data.map(item => `

    <div class="booking">

      <strong>${escapeHtml(item.nome)}</strong>

      <div class="muted">
        ${escapeHtml(item.persona)}
        •
        ${escapeHtml(item.data)}
        •
        ${escapeHtml(item.orario)}
      </div>

    </div>

  `).join("");

}


/* Prenotazione */

document
  .getElementById("bookingForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const button =
      document.getElementById("submitButton");

    const message =
      document.getElementById("message");

    const nome =
      document.getElementById("name").value.trim();

    const persona =
      document.querySelector(
        'input[name="person"]:checked'
      ).value;

    const data =
      document.getElementById("date").value;

    const orario =
      document.getElementById("time").value;


    button.disabled = true;

    message.className = "";

    message.textContent =
      "Registrazione in corso...";


    const { error } =
      await supabaseClient
        .from("prenotazioni")
        .insert({
          nome: nome,
          persona: persona,
          data: data,
          orario: orario
        });


    if (error) {

      console.error(error);

      if (error.code === "23505") {

        message.className = "error";

        message.textContent =
          "❌ Questo orario è già occupato per " +
          persona + ".";

      } else {

        message.className = "error";

        message.textContent =
          "❌ Non è stato possibile effettuare la prenotazione.";

      }

      button.disabled = false;

      return;
    }


    message.className = "success";

    message.textContent =
      "✅ Prenotazione effettuata!";


    document
      .getElementById("bookingForm")
      .reset();


    document
      .querySelector(".person")
      .click();


    button.disabled = false;


    loadBookings();

  });


/* Protezione visualizzazione testo */

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


loadBookings();

</script>

</body>
</html>
