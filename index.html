<!DOCTYPE html>
<html lang="it">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background:
        radial-gradient(
          circle at top,
          #292929 0%,
          #111 45%,
          #090909 100%
        );

      color: #ffffff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      min-height: 100vh;
    }


    .container {
      width: 100%;
      max-width: 650px;

      margin: auto;

      padding:
        20px
        15px
        45px;
    }


    /* HERO */

    .hero {
      text-align: center;

      padding:
        20px
        10px
        25px;
    }


    .logo {
      width: 82px;
      height: 82px;

      margin: 0 auto 18px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #e3bd70,
          #a87d35
        );

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 40px;

      box-shadow:
        0 10px 35px
        rgba(201,164,92,.25);
    }


    .hero h1 {
      margin: 0;

      font-size: 30px;

      line-height: 1.2;

      letter-spacing: .5px;
    }


    .hero p {
      margin:
        10px
        0
        0;

      color: #bdbdbd;

      font-size: 15px;
    }


    /* CARD */

    .card {
      background: #1c1c1c;

      border:
        1px solid
        #343434;

      border-radius: 22px;

      padding: 22px;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.35);
    }


    /* STEP */

    .step {
      margin-bottom: 26px;
    }


    .step:last-child {
      margin-bottom: 0;
    }


    .step-title {
      font-size: 17px;

      font-weight: bold;

      margin-bottom: 12px;
    }


    /* BARBIERI */

    .people {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 12px;
    }


    .person {
      padding: 18px 10px;

      background: #252525;

      border:
        2px solid
        #444;

      border-radius: 16px;

      text-align: center;

      cursor: pointer;

      transition:
        .2s ease;
    }


    .person:hover {
      border-color:
        #c9a45c;
    }


    .person.selected {
      background: #332b1e;

      border-color:
        #c9a45c;

      box-shadow:
        0 0 0 1px
        rgba(201,164,92,.2);
    }


    .person-name {
      font-size: 20px;

      font-weight: bold;
    }


    .person-sub {
      margin-top: 5px;

      font-size: 13px;

      color: #aaa;
    }


    /* INPUT */

    input[type="text"],
    input[type="date"] {

      width: 100%;

      padding: 15px;

      border-radius: 13px;

      border:
        1px solid
        #454545;

      background: #292929;

      color: #fff;

      font-size: 16px;

      outline: none;
    }


    input[type="text"]:focus,
    input[type="date"]:focus {

      border-color:
        #c9a45c;
    }


    input[type="date"] {
      color-scheme: dark;
    }


    /* ORARI */

    .times {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;
    }


    .time {

      padding: 13px 5px;

      background: #292929;

      border:
        1px solid
        #454545;

      color: #fff;

      border-radius: 11px;

      text-align: center;

      font-weight: bold;

      cursor: pointer;

      transition:
        .2s ease;
    }


    .time:hover {

      border-color:
        #c9a45c;
    }


    .time.selected {

      background:
        #c9a45c;

      border-color:
        #c9a45c;

      color: #111;
    }


    .time.occupied {

      background: #141414;

      border-color: #222;

      color: #555;

      cursor: not-allowed;

      text-decoration:
        line-through;
    }


    .info {

      margin:
        12px
        0
        0;

      text-align: center;

      color: #999;

      font-size: 13px;
    }


    /* BUTTON */

    .book-button {

      width: 100%;

      padding: 17px;

      margin-top: 5px;

      border: 0;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #dfbd73,
          #b88c42
        );

      color: #111;

      font-size: 18px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 8px 25px
        rgba(201,164,92,.18);

      transition:
        .2s ease;
    }


    .book-button:hover {
      transform:
        translateY(-1px);
    }


    .book-button:disabled {

      opacity: .45;

      cursor:
        not-allowed;

      transform:
        none;
    }


    /* MESSAGGI */

    .message {

      margin-top: 15px;

      text-align: center;

      font-weight: bold;

      line-height: 1.4;
    }


    .success {
      color: #69d184;
    }


    .error {
      color: #ff7777;
    }


    /* FOOTER */

    .footer {

      text-align: center;

      margin-top: 28px;

      color: #999;

      font-size: 14px;

      line-height: 1.8;
    }


    .footer-name {

      color: #fff;

      font-size: 17px;

      font-weight: bold;

      margin-bottom: 7px;
    }


    .footer a {

      color: #d8b56d;

      text-decoration: none;

      font-weight: bold;
    }


    .footer a:hover {

      text-decoration:
        underline;
    }


    /* MOBILE */

    @media (max-width: 500px) {

      .container {
        padding:
          15px
          12px
          35px;
      }


      .hero h1 {
        font-size: 25px;
      }


      .people {
        grid-template-columns:
          1fr;
      }


      .times {
        grid-template-columns:
          repeat(2, 1fr);
      }


      .card {
        padding: 18px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- TESTATA -->

  <div class="hero">

    <div class="logo">
      ✂️
    </div>

    <h1>
      𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹
    </h1>

    <p>
      Prenota il tuo appuntamento
    </p>

  </div>



  <!-- PRENOTAZIONE -->

  <div class="card">


    <!-- BARBIERE -->

    <div class="step">

      <div class="step-title">
        1. Scegli il barbiere
      </div>


      <div class="people">


        <div
          class="person selected"
          data-person="Matteo"
        >

          <div class="person-name">
            Matteo
          </div>

          <div class="person-sub">
            Barbiere
          </div>

        </div>



        <div
          class="person"
          data-person="Tommaso"
        >

          <div class="person-name">
            Tommaso
          </div>

          <div class="person-sub">
            Barbiere
          </div>

        </div>


      </div>

    </div>



    <!-- NOME -->

    <div class="step">

      <div class="step-title">
        2. Il tuo nome
      </div>


      <input
        id="name"
        type="text"
        maxlength="80"
        placeholder="Nome e cognome"
      >

    </div>



    <!-- DATA -->

    <div class="step">

      <div class="step-title">
        3. Scegli il giorno
      </div>


      <input
        id="date"
        type="date"
      >

    </div>



    <!-- ORARIO -->

    <div class="step">

      <div class="step-title">
        4. Scegli l'orario
      </div>


      <div
        id="times"
        class="times"
      ></div>


      <div
        id="timeInfo"
        class="info"
      >
        Scegli una data per vedere
        gli orari disponibili.
      </div>

    </div>



    <!-- PRENOTA -->

    <button
      id="bookButton"
      class="book-button"
      disabled
    >
      PRENOTA ORA
    </button>


    <div
      id="message"
      class="message"
    ></div>


  </div>



  <!-- CONTATTI -->

  <div class="footer">

    <div class="footer-name">
      𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹
    </div>


    <div>
      Instagram:
      <strong>
        @𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹
      </strong>
    </div>


    <div>

      WhatsApp:

      <a
        href="https://wa.me/393201519469"
        target="_blank"
      >
        3201519469
      </a>

      ·

      <a
        href="https://wa.me/393274454796"
        target="_blank"
      >
        3274454796
      </a>

    </div>

  </div>


</div>



<script>


/*
==================================================
SUPABASE
==================================================
*/

const SUPABASE_URL =
  "https://nieyajttmfkxowwjqglb.supabase.co";


/*
IMPORTANTE:

QUI DEVI INCOLLARE LA STESSA
PUBLISHABLE KEY CHE HAI GIÀ USATO.

NON INSERIRE LA SECRET KEY.
*/

const SUPABASE_KEY =
  "sb_publishable_9ShmvYVhOPGoU90-Lkwdvw_BVy3dz_X";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/*
==================================================
VARIABILI
==================================================
*/

let selectedPerson =
  "Matteo";

let selectedTime =
  null;



/*
==================================================
ORARI
==================================================

09:00 - 12:00
14:00 - 19:00

Ogni 30 minuti.
*/

const TIMES = [

  "09:00",
  "09:30",
  "10:00",
  "10:30",
  "11:00",
  "11:30",
  "12:00",

  "14:00",
  "14:30",
  "15:00",
  "15:30",
  "16:00",
  "16:30",
  "17:00",
  "17:30",
  "18:00",
  "18:30",
  "19:00"

];



/*
==================================================
DATA MINIMA
==================================================
*/

const dateInput =
  document.getElementById(
    "date"
  );


const today =
  new Date();


const todayString =
  today
    .toISOString()
    .split("T")[0];


dateInput.min =
  todayString;



/*
==================================================
SCELTA BARBIERE
==================================================
*/

document
  .querySelectorAll(".person")
  .forEach(person => {


    person.addEventListener(
      "click",
      () => {


        document
          .querySelectorAll(".person")
          .forEach(p => {

            p.classList.remove(
              "selected"
            );

          });


        person.classList.add(
          "selected"
        );


        selectedPerson =
          person.dataset.person;


        selectedTime =
          null;


        loadTimes();

      }
    );


  });



/*
==================================================
CAMBIO DATA
==================================================
*/

dateInput.addEventListener(
  "change",
  () => {

    selectedTime =
      null;

    loadTimes();

  }
);



/*
==================================================
CARICA ORARI OCCUPATI
==================================================
*/

async function loadTimes() {


  const times =
    document.getElementById(
      "times"
    );


  const info =
    document.getElementById(
      "timeInfo"
    );


  const bookButton =
    document.getElementById(
      "bookButton"
    );


  bookButton.disabled =
    true;


  times.innerHTML =
    "";


  selectedTime =
    null;


  if (!dateInput.value) {

    info.className =
      "info";

    info.textContent =
      "Scegli una data per vedere gli orari disponibili.";

    return;

  }


  info.className =
    "info";

  info.textContent =
    "Controllo disponibilità...";


  const { data, error } =
    await supabaseClient.rpc(
      "get_booked_slots",
      {
        p_persona:
          selectedPerson,

        p_data:
          dateInput.value
      }
    );


  if (error) {

    console.error(error);


    info.className =
      "info error";

    info.textContent =
      "Errore nel caricamento degli orari.";

    return;

  }


  const occupied =
    (data || []).map(
      item =>
        String(
          item.orario
        ).substring(0, 5)
    );



  TIMES.forEach(time => {


    const button =
      document.createElement(
        "div"
      );


    button.className =
      "time";


    button.textContent =
      time;



    if (
      occupied.includes(
        time
      )
    ) {


      button.classList.add(
        "occupied"
      );


      button.textContent =
        time +
        " • occupato";


    } else {


      button.addEventListener(
        "click",
        () => {


          document
            .querySelectorAll(
              ".time"
            )
            .forEach(t => {

              t.classList.remove(
                "selected"
              );

            });


          button.classList.add(
            "selected"
          );


          selectedTime =
            time;


          bookButton.disabled =
            false;


        }
      );

    }


    times.appendChild(
      button
    );


  });



  const available =
    TIMES.filter(
      time =>
        !occupied.includes(
          time
        )
    );


  if (
    available.length === 0
  ) {


    info.className =
      "info error";


    info.textContent =
      "Nessun orario disponibile per questo giorno.";


  } else {


    info.className =
      "info";


    info.textContent =
      "Scegli uno degli orari disponibili.";

  }

}



/*
==================================================
PRENOTAZIONE
==================================================
*/

document
  .getElementById(
    "bookButton"
  )
  .addEventListener(
    "click",
    async () => {


      const name =
        document
          .getElementById(
            "name"
          )
          .value
          .trim();


      const message =
        document.getElementById(
          "message"
        );


      const bookButton =
        document.getElementById(
          "bookButton"
        );



      if (!name) {


        message.className =
          "message error";


        message.textContent =
          "Inserisci il tuo nome.";


        return;

      }



      if (!dateInput.value) {


        message.className =
          "message error";


        message.textContent =
          "Scegli una data.";


        return;

      }



      if (!selectedTime) {


        message.className =
          "message error";


        message.textContent =
          "Scegli un orario.";


        return;

      }



      bookButton.disabled =
        true;


      message.className =
        "message";


      message.textContent =
        "Prenotazione in corso...";



      const { error } =
        await supabaseClient
          .from(
            "prenotazioni"
          )
          .insert({

            nome:
              name,

            persona:
              selectedPerson,

            data:
              dateInput.value,

            orario:
              selectedTime

          });



      if (error) {


        console.error(error);


        message.className =
          "message error";


        if (
          error.code ===
          "23505"
        ) {


          message.textContent =
            "❌ Questo orario è appena stato prenotato. Scegline un altro.";


        } else {


          message.textContent =
            "❌ Non è stato possibile completare la prenotazione.";

        }


        loadTimes();


        return;

      }



      message.className =
        "message success";


      message.textContent =
        "✅ Prenotazione effettuata! Ti aspettiamo.";


      document
        .getElementById(
          "name"
        )
        .value =
        "";


      selectedTime =
        null;


      loadTimes();


    }
  );


</script>


</body>
</html>
