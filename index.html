<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;

  background:
    linear-gradient(
      rgba(0,0,0,.72),
      rgba(0,0,0,.86)
    ),
    url("barber-background.webp")
    center center / cover fixed no-repeat;

  background-color:#080808;
}

.container{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:20px 15px 45px;
}

/* =========================
   HERO
========================= */

.hero{
  text-align:center;
  padding:10px 0 24px;
}

.logo{
  width:115px;
  height:115px;
  margin:0 auto 12px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #c59648;
  background:#050505;
  box-shadow:
    0 0 0 5px rgba(197,150,72,.10),
    0 15px 40px rgba(0,0,0,.7);
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(27px,6vw,42px);
  letter-spacing:1px;
  text-shadow:0 3px 20px #000;
}

h1:after{
  content:"";
  display:block;
  width:280px;
  max-width:80%;
  height:1px;
  margin:12px auto 9px;
  background:linear-gradient(
    90deg,
    transparent,
    #c59648,
    transparent
  );
}

.hero p{
  margin:0;
  color:#d4a45a;
  font-weight:bold;
}

/* =========================
   CARD
========================= */

.card{
  background:
    linear-gradient(
      145deg,
      rgba(20,20,20,.96),
      rgba(7,7,7,.96)
    );

  border:1px solid #a87832;
  border-radius:20px;
  padding:22px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.75),
    inset 0 0 0 1px rgba(255,255,255,.025);

  backdrop-filter:blur(8px);
}

.step{
  margin-bottom:24px;
}

.step-title{
  font-size:17px;
  font-weight:800;
  padding-bottom:9px;
  margin-bottom:13px;
  border-bottom:1px solid rgba(197,150,72,.4);
}

/* =========================
   BARBIERI
========================= */

.people{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.person{
  padding:17px 10px;
  background:linear-gradient(145deg,#222,#111);
  border:1px solid #4b4b4b;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.person:hover{
  border-color:#c59648;
  transform:translateY(-2px);
}

.person.selected{
  background:
    linear-gradient(
      145deg,
      #3b2c18,
      #20170c
    );

  border-color:#d2a04e;

  box-shadow:
    0 0 0 1px rgba(210,160,78,.15),
    0 12px 25px rgba(0,0,0,.4);
}

.barber-icon{
  width:62px;
  height:62px;
  margin:0 auto 9px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #a67b3b;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #45351e,
      #111
    );

  color:#d5a75b;
}

.barber-icon svg{
  width:35px;
  height:35px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.person-name{
  font-size:20px;
  font-weight:800;
}

.person-sub{
  margin-top:4px;
  color:#aaa;
  font-size:13px;
}

/* =========================
   GIORNI
========================= */

.days-wrapper{
  display:flex;
  align-items:center;
  gap:7px;
}

.arrow{
  width:43px;
  min-width:43px;
  height:50px;
  border:1px solid #484848;
  border-radius:12px;
  background:#171717;
  color:#fff;
  font-size:24px;
  cursor:pointer;
}

.arrow:hover{
  border-color:#c59648;
  color:#d5a75b;
}

.days{
  display:flex;
  gap:7px;
  overflow:hidden;
  flex:1;
}

.day{
  min-width:78px;
  padding:9px 4px;
  background:#191919;
  border:1px solid #484848;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
}

.day:hover{
  border-color:#c59648;
}

.day.selected{
  background:
    linear-gradient(
      180deg,
      #d5a354,
      #ad7629
    );

  color:#15100a;
  border-color:#dfad5c;
}

.day-name{
  font-size:10px;
  text-transform:uppercase;
  font-weight:800;
}

.day-number{
  font-size:21px;
  font-weight:900;
  margin-top:2px;
}

.day-month{
  font-size:10px;
}

/* =========================
   ORARI
========================= */

.times{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.time{
  padding:13px 5px;
  background:#1c1c1c;
  border:1px solid #454545;
  border-radius:10px;
  text-align:center;
  font-weight:800;
  cursor:pointer;
}

.time:hover{
  border-color:#c59648;
}

.time.selected{
  background:#c59648;
  border-color:#e0b568;
  color:#120e08;
}

.time.occupied{
  background:#101010;
  color:#555;
  border-color:#292929;
  text-decoration:line-through;
  cursor:not-allowed;
}

.info{
  text-align:center;
  color:#999;
  font-size:12px;
  margin-top:10px;
}

.info.error{
  color:#ff7777;
}

/* =========================
   NOME
========================= */

input{
  width:100%;
  padding:15px;
  border-radius:11px;
  border:1px solid #484848;
  background:#151515;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#c59648;
}

/* =========================
   PRENOTA
========================= */

.book-button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #d3a052,
      #a97022
    );

  color:#120e08;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.book-button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.message{
  margin-top:14px;
  text-align:center;
  font-weight:bold;
}

.error{
  color:#ff7777;
}

.success{
  color:#72db8b;
}

/* =========================
   CONFERMA
========================= */

.confirmation{
  margin-top:15px;
  padding:18px;
  background:#191919;
  border:1px solid #b8873d;
  border-radius:15px;
}

.confirmation-title{
  color:white;
  font-size:19px;
  margin-bottom:10px;
}

.confirmation-details{
  color:#ddd;
  line-height:1.8;
  margin-bottom:14px;
}

.whatsapp-button{
  display:block;
  padding:14px;
  background:#25D366;
  color:white;
  border-radius:11px;
  text-decoration:none;
  font-weight:bold;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;
  margin-top:22px;
  padding-top:17px;
  border-top:1px solid rgba(197,150,72,.3);
  color:#999;
  font-size:13px;
  line-height:1.9;
}

.footer-name{
  color:#f2eadc;
  font-family:Georgia,serif;
  font-size:18px;
  font-weight:bold;
}

.footer a{
  color:#d2a15a;
  text-decoration:none;
  font-weight:bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  body{
    background:
      linear-gradient(
        rgba(0,0,0,.84),
        rgba(0,0,0,.94)
      ),
      url("barber-background.webp")
      center center / cover fixed no-repeat;
  }

  .container{
    padding:13px 10px 35px;
  }

  .logo{
    width:98px;
    height:98px;
  }

  .card{
    padding:17px;
  }

  .times{
    grid-template-columns:repeat(2,1fr);
  }

  .day{
    min-width:68px;
  }

  h1{
    font-size:26px;
  }

}

</style>
</head>


<body>

<div class="container">

<header class="hero">

  <div class="logo">
    <img
      src="logo.png"
      alt="𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹"
    >
  </div>

  <h1>
    𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹
  </h1>

  <p>
    Prenota il tuo appuntamento
  </p>

</header>


<section class="card">


<!-- BARBIERI -->

<div class="step">

  <div class="step-title">

  </div>

  <div class="people">


    <div
      class="person selected"

    >

      <div class="barber-icon">

        <svg viewBox="0 0 48 48">

</div>


<!-- GIORNI -->

<div class="step">

      id="prevDays"

    >

    </button>

<button

>
  ✂️ PRENOTA ORA
</button>

></div>


</section>


<footer class="footer">

  <div class="footer-name">
    💈 𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹
  </div>

  <div>
    Instagram:
    @𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹
  </div>

  <div>

    WhatsApp:

    <a
      href="https://wa.me/393201519469"
      target="_blank"
    >
      3201519469
    </a>

    ·

    <a
      href="https://wa.me/393274454796"
      target="_blank"
    >
      3274454796
    </a>

  </div>

</footer>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://nieyajttmfkxowwjqglb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9ShmvYVhOPGoU90-Lkwdvw_BVy3dz_X";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATO
===================================================== */

let selectedPerson = "Matteo";
let selectedDate = null;
let selectedTime = null;
let dayOffset = 0;


/* =====================================================
   ORARI
===================================================== */

const TIMES = [

  "09:00",
  "09:30",
  "10:00",

  "10:30",
  "11:00",
  "11:30",

  "12:00",

  "14:00",
  "14:30",

  "15:00",
  "15:30",
  "16:00",

  "16:30",
  "17:00",
  "17:30",

  "18:00",
  "18:30",
  "19:00"

];


/* =====================================================
   ELEMENTI
===================================================== */

const daysContainer =
  document.getElementById("days");

const timesContainer =
  document.getElementById("times");

const timeInfo =
  document.getElementById("timeInfo");

const bookButton =
  document.getElementById("bookButton");

const message =
  document.getElementById("message");

const nameInput =
  document.getElementById("name");


/* =====================================================
   DATA
===================================================== */

function dateString(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


/* =====================================================
   GIORNI
===================================================== */

function renderDays(){

  daysContainer.innerHTML = "";

  const today = new Date();

  today.setHours(
    0,0,0,0
  );

  for(
    let i = 0;
    i < 7;
    i++
  ){

    const date =
      new Date(today);

    date.setDate(
      today.getDate()
      +
      dayOffset
      +
      i
    );

    const value =
      dateString(date);

    const day =
      document.createElement("div");

    day.className = "day";

    if(
      selectedDate === value
    ){

      day.classList.add(
        "selected"
      );

    }

    const weekday =
      new Intl.DateTimeFormat(
        "it-IT",
        {
          weekday:"short"
        }
      ).format(date);

    const month =
      new Intl.DateTimeFormat(
        "it-IT",
        {
          month:"short"
        }
      ).format(date);

    const todayText =
      i === 0 &&
      dayOffset === 0
        ? "OGGI"
        : weekday;

    day.innerHTML = `

      <div class="day-name">
        ${todayText}
      </div>

      <div class="day-number">
        ${date.getDate()}
      </div>

      <div class="day-month">
        ${month}
      </div>

    `;

    day.addEventListener(
      "click",
      () => {

        selectedDate = value;

        selectedTime = null;

        renderDays();

        loadTimes();

      }
    );

    daysContainer.appendChild(day);

  }

}


/* =====================================================
   FRECCE
===================================================== */

document
  .getElementById("prevDays")
  .addEventListener(
    "click",
    () => {

      if(dayOffset > 0){

        dayOffset--;

        renderDays();

      }

    }
  );


document
  .getElementById("nextDays")
  .addEventListener(
    "click",
    () => {

      dayOffset++;

      renderDays();

    }
  );


/* =====================================================
   BARBIERI
===================================================== */

document
  .querySelectorAll(".person")
  .forEach(
    person => {

      person.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".person")
            .forEach(
              p =>
                p.classList.remove(
                  "selected"
                )
            );

          person.classList.add(
            "selected"
          );

          selectedPerson =
            person.dataset.person;

          selectedTime = null;

          loadTimes();

        }
      );

    }
  );


/* =====================================================
   ORARI DISPONIBILI
===================================================== */

async function loadTimes(){

  timesContainer.innerHTML = "";

  selectedTime = null;

  bookButton.disabled = true;

  timeInfo.className = "info";

  timeInfo.textContent =
    "Controllo disponibilità...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_booked_slots",
        {
          p_persona:
            selectedPerson,

          p_data:
            selectedDate
        }
      );


    if(error){

      console.error(error);

      timeInfo.className =
        "info error";

      timeInfo.textContent =
        "Errore nel caricamento degli orari.";

      return;

    }


    const occupied =
      (data || []).map(
        item =>
          String(
            item.orario
          ).substring(0,5)
      );


    TIMES.forEach(
      time => {

        const button =
          document.createElement("div");

        button.className = "time";

        button.textContent = time;


        if(
          occupied.includes(time)
        ){

          button.classList.add(
            "occupied"
          );

          button.textContent =
            time + " • occupato";

        }
        else{

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(".time")
                .forEach(
                  t =>
                    t.classList.remove(
                      "selected"
                    )
                );

              button.classList.add(
                "selected"
              );

              selectedTime = time;

              bookButton.disabled =
                false;

            }
          );

        }


        timesContainer.appendChild(
          button
        );

      }
    );


    const available =
      TIMES.filter(
        time =>
          !occupied.includes(time)
      );


    timeInfo.textContent =
      available.length
        ? "Scegli l'orario che preferisci."
        : "Nessun orario disponibile.";


    if(!available.length){

      timeInfo.className =
        "info error";

    }

  }
  catch(error){

    console.error(error);

    timeInfo.className =
      "info error";

    timeInfo.textContent =
      "Errore di connessione.";

  }

}


/* =====================================================
   PRENOTA
===================================================== */

bookButton.addEventListener(
  "click",
  async () => {

    const name =
      nameInput.value.trim();


    if(!name){

      message.className =
        "message error";

      message.textContent =
        "Inserisci il tuo nome.";

      nameInput.focus();

      return;

    }


    if(!selectedTime){

      message.className =
        "message error";

      message.textContent =
        "Scegli un orario.";

      return;

    }


    bookButton.disabled = true;

    message.className =
      "message";

    message.textContent =
      "Prenotazione in corso...";


    const {
      error
    } =
      await supabaseClient
        .from("prenotazioni")
        .insert({

          nome:name,

          persona:
            selectedPerson,

          data:
            selectedDate,

          orario:
            selectedTime

        });


    if(error){

      console.error(error);

      message.className =
        "message error";


      if(
        error.code === "23505"
      ){

        message.textContent =
          "❌ Questo orario è appena stato prenotato.";

      }
      else{

        message.textContent =
          "❌ Errore. Riprova.";

      }

      loadTimes();

      return;

    }


    const formattedDate =
      new Date(
        selectedDate +
        "T00:00:00"
      ).toLocaleDateString(
        "it-IT",
        {
          weekday:"long",
          day:"numeric",
          month:"long",
          year:"numeric"
        }
      );


    const whatsappNumber =
      selectedPerson === "Matteo"
        ? "393201519469"
        : "393274454796";


    const whatsappText =
      `Ciao! Sono ${name}, ` +
      `ho appena prenotato da ` +
      `𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹.` +
      `\n\n` +
      `✂️ Barbiere: ${selectedPerson}` +
      `\n📅 ${formattedDate}` +
      `\n🕐 Ore ${selectedTime}`;


    const whatsappLink =
      "https://wa.me/" +
      whatsappNumber +
      "?text=" +
      encodeURIComponent(
        whatsappText
      );


    message.className =
      "message success";


    message.innerHTML = `

      <div class="confirmation">

        <div class="confirmation-title">
          ✅ PRENOTAZIONE CONFERMATA
        </div>

        <div class="confirmation-details">

          ✂️ Barbiere:
          <strong>
            ${selectedPerson}
          </strong>

          <br>

          📅 Giorno:
          <strong>
            ${formattedDate}
          </strong>

          <br>

          🕐 Orario:
          <strong>
            ${selectedTime}
          </strong>

          <br>

          👤 Nome:
          <strong>
            ${name}
          </strong>

        </div>

        <a
          class="whatsapp-button"
          href="${whatsappLink}"
          target="_blank"
          rel="noopener"
        >
          📱 CONFERMA SU WHATSAPP
        </a>

      </div>

    `;


    nameInput.value = "";

    loadTimes();

  }
);


/* =====================================================
   AVVIO
===================================================== */

const today =
  new Date();

selectedDate =
  dateString(today);

renderDays();

loadTimes();

</script>

</body>
</html>
