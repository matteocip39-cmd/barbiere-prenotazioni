<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#292929,#111 48%,#090909);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:18px 14px 45px;
}

.hero{
  text-align:center;
  padding:20px 8px 25px;
}

.logo{
  width:82px;
  height:82px;
  margin:auto;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:#111;

  box-shadow:
    0 10px 35px
    rgba(201,164,92,.25);
}

.logo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}
}

.hero h1{
  margin:16px 0 6px;
  font-size:29px;
  line-height:1.2;
}

.hero p{
  margin:0;
  color:#aaa;
}

.card{
  background:#1c1c1c;
  border:1px solid #343434;
  border-radius:22px;
  padding:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.step{
  margin-bottom:25px;
}

.step-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:12px;
}

/* BARBIERI */

.people{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.person{
  padding:18px 10px;
  background:#252525;
  border:2px solid #444;
  border-radius:16px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.person:hover{
  border-color:#c9a45c;
}

.person.selected{
  background:#332b1e;
  border-color:#c9a45c;
}

.person-name{
  font-size:20px;
  font-weight:bold;
}

.person-sub{
  margin-top:5px;
  color:#aaa;
  font-size:13px;
}

/* GIORNI */

.days-wrapper{
  display:flex;
  align-items:center;
  gap:7px;
}

.arrow{
  width:42px;
  min-width:42px;
  height:48px;
  margin:0;
  padding:0;
  border:1px solid #444;
  border-radius:12px;
  background:#292929;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.arrow:hover{
  border-color:#c9a45c;
}

.days{
  display:flex;
  gap:8px;
  overflow:hidden;
  flex:1;
}

.day{
  min-width:72px;
  padding:10px 6px;
  border:2px solid #444;
  background:#252525;
  border-radius:13px;
  text-align:center;
  cursor:pointer;
}

.day:hover{
  border-color:#c9a45c;
}

.day.selected{
  background:#c9a45c;
  border-color:#c9a45c;
  color:#111;
}

.day-name{
  font-size:12px;
  text-transform:uppercase;
  font-weight:bold;
}

.day-number{
  font-size:20px;
  font-weight:bold;
  margin-top:3px;
}

.day-month{
  font-size:11px;
  margin-top:2px;
}

/* ORARI */

.times{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.time{
  padding:14px 5px;
  background:#292929;
  border:1px solid #454545;
  color:white;
  border-radius:11px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

.time:hover{
  border-color:#c9a45c;
}

.time.selected{
  background:#c9a45c;
  border-color:#c9a45c;
  color:#111;
}

.time.occupied{
  background:#141414;
  border-color:#222;
  color:#555;
  cursor:not-allowed;
  text-decoration:line-through;
}

.info{
  margin:12px 0 0;
  text-align:center;
  color:#999;
  font-size:13px;
}

/* NOME */

input[type="text"]{
  width:100%;
  padding:15px;
  border-radius:13px;
  border:1px solid #454545;
  background:#292929;
  color:#fff;
  font-size:16px;
  outline:none;
}

input[type="text"]:focus{
  border-color:#c9a45c;
}

/* BUTTON */

.book-button{
  width:100%;
  padding:17px;
  margin-top:4px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#dfbd73,#b88c42);
  color:#111;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.book-button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.message{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
  line-height:1.4;
}

.success{
  color:#69d184;
}

.error{
  color:#ff7777;
}

/* FOOTER */

.footer{
  text-align:center;
  margin-top:28px;
  color:#999;
  font-size:14px;
  line-height:1.9;
}

.footer-name{
  color:white;
  font-size:17px;
  font-weight:bold;
}

.footer a{
  color:#d8b56d;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:500px){

  .people{
    grid-template-columns:1fr;
  }

  .times{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:25px;
  }

  .card{
    padding:17px;
  }

  .day{
    min-width:68px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">

    <div class="logo">
  <img
    src="logo.png"
    alt="𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹"
  >
</div>

    <h1>𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹</h1>

    <p>Prenota il tuo appuntamento</p>

  </div>


  <div class="card">

    <!-- BARBIERE -->

    <div class="step">

      <div class="step-title">
        1. Scegli il barbiere
      </div>

      <div class="people">

        <div
          class="person selected"
          data-person="Matteo"
        >
          <div class="person-name">Matteo</div>
          <div class="person-sub">Barbiere</div>
        </div>

        <div
          class="person"
          data-person="Tommaso"
        >
          <div class="person-name">Tommaso</div>
          <div class="person-sub">Barbiere</div>
        </div>

      </div>

    </div>


    <!-- GIORNI -->

    <div class="step">

      <div class="step-title">
        2. Scegli il giorno
      </div>

      <div class="days-wrapper">

        <button
          class="arrow"
          id="prevDays"
          type="button"
        >
          ‹
        </button>

        <div
          class="days"
          id="days"
        ></div>

        <button
          class="arrow"
          id="nextDays"
          type="button"
        >
          ›
        </button>

      </div>

    </div>


    <!-- ORARI -->

    <div class="step">

      <div class="step-title">
        3. Scegli l'orario
      </div>

      <div
        id="times"
        class="times"
      ></div>

      <div
        id="timeInfo"
        class="info"
      >
        Caricamento...
      </div>

    </div>


    <!-- NOME -->

    <div class="step">

      <div class="step-title">
        4. Il tuo nome
      </div>

      <input
        id="name"
        type="text"
        maxlength="80"
        placeholder="Nome e cognome"
      >

    </div>


    <button
      id="bookButton"
      class="book-button"
      type="button"
      disabled
    >
      PRENOTA ORA
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <div class="footer">

    <div class="footer-name">
      𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹
    </div>

    <div>
      Instagram:
      @𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹
    </div>

    <div>
      WhatsApp:
      <a
        href="https://wa.me/393201519469"
        target="_blank"
      >
        3201519469
      </a>
      ·
      <a
        href="https://wa.me/393274454796"
        target="_blank"
      >
        3274454796
      </a>
    </div>

  </div>

</div>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
  "https://nieyajttmfkxowwjqglb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9ShmvYVhOPGoU90-Lkwdvw_BVy3dz_X";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==============================
   VARIABILI
============================== */

let selectedPerson = "Matteo";
let selectedDate = null;
let selectedTime = null;

let dayOffset = 0;


/* ==============================
   ORARI
============================== */

const TIMES = [
  "09:00",
  "09:30",
  "10:00",
  "10:30",
  "11:00",
  "11:30",
  "12:00",
  "14:00",
  "14:30",
  "15:00",
  "15:30",
  "16:00",
  "16:30",
  "17:00",
  "17:30",
  "18:00",
  "18:30",
  "19:00"
];


/* ==============================
   ELEMENTI
============================== */

const daysContainer =
  document.getElementById("days");

const timesContainer =
  document.getElementById("times");

const timeInfo =
  document.getElementById("timeInfo");

const bookButton =
  document.getElementById("bookButton");

const message =
  document.getElementById("message");

const nameInput =
  document.getElementById("name");


/* ==============================
   DATA LOCALE
============================== */

function dateString(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


/* ==============================
   GIORNI
============================== */

function renderDays(){

  daysContainer.innerHTML = "";

  const today =
    new Date();

  today.setHours(
    0,0,0,0
  );

  for(
    let i = 0;
    i < 7;
    i++
  ){

    const date =
      new Date(today);

    date.setDate(
      today.getDate()
      +
      dayOffset
      +
      i
    );

    const dateValue =
      dateString(date);

    const day =
      document.createElement("div");

    day.className =
      "day";

    if(
      selectedDate ===
      dateValue
    ){

      day.classList.add(
        "selected"
      );

    }


    const dayName =
      new Intl.DateTimeFormat(
        "it-IT",
        {
          weekday:"short"
        }
      ).format(date);


    const month =
      new Intl.DateTimeFormat(
        "it-IT",
        {
          month:"short"
        }
      ).format(date);


    const isToday =
      i === 0 &&
      dayOffset === 0;


    day.innerHTML = `

      <div class="day-name">
        ${isToday ? "OGGI" : dayName}
      </div>

      <div class="day-number">
        ${date.getDate()}
      </div>

      <div class="day-month">
        ${month}
      </div>

    `;


    day.addEventListener(
      "click",
      () => {

        selectedDate =
          dateValue;

        selectedTime =
          null;

        renderDays();

        loadTimes();

      }
    );


    daysContainer.appendChild(
      day
    );

  }

}


/* ==============================
   FRECCIA INDIETRO
============================== */

document
  .getElementById("prevDays")
  .addEventListener(
    "click",
    () => {

      if(dayOffset > 0){

        dayOffset--;

        renderDays();

      }

    }
  );


/* ==============================
   FRECCIA AVANTI
============================== */

document
  .getElementById("nextDays")
  .addEventListener(
    "click",
    () => {

      dayOffset++;

      renderDays();

    }
  );


/* ==============================
   BARBIERE
============================== */

document
  .querySelectorAll(".person")
  .forEach(person => {

    person.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".person")
          .forEach(p =>
            p.classList.remove(
              "selected"
            )
          );


        person.classList.add(
          "selected"
        );


        selectedPerson =
          person.dataset.person;


        selectedTime =
          null;


        loadTimes();

      }
    );

  });


/* ==============================
   CARICA ORARI
============================== */

async function loadTimes(){

  timesContainer.innerHTML =
    "";

  selectedTime =
    null;

  bookButton.disabled =
    true;


  if(!selectedDate){

    timeInfo.textContent =
      "Scegli un giorno.";

    return;

  }


  timeInfo.textContent =
    "Controllo disponibilità...";


  const { data, error } =
    await supabaseClient.rpc(
      "get_booked_slots",
      {
        p_persona:
          selectedPerson,

        p_data:
          selectedDate
      }
    );


  if(error){

    console.error(error);

    timeInfo.className =
      "info error";

    timeInfo.textContent =
      "Errore nel caricamento degli orari.";

    return;

  }


  const occupied =
    (data || []).map(
      item =>
        String(
          item.orario
        ).substring(0,5)
    );


  TIMES.forEach(
    time => {

      const button =
        document.createElement(
          "div"
        );

      button.className =
        "time";

      button.textContent =
        time;


      if(
        occupied.includes(time)
      ){

        button.classList.add(
          "occupied"
        );

        button.textContent =
          time +
          " • occupato";

      }
      else{

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".time"
              )
              .forEach(t =>
                t.classList.remove(
                  "selected"
                )
              );


            button.classList.add(
              "selected"
            );


            selectedTime =
              time;


            bookButton.disabled =
              false;

          }
        );

      }


      timesContainer.appendChild(
        button
      );

    }
  );


  const available =
    TIMES.filter(
      time =>
        !occupied.includes(
          time
        )
    );


  if(
    available.length === 0
  ){

    timeInfo.className =
      "info error";

    timeInfo.textContent =
      "Nessun orario disponibile.";

  }
  else{

    timeInfo.className =
      "info";

    timeInfo.textContent =
      "Scegli l'orario che preferisci.";

  }

}


/* ==============================
   PRENOTAZIONE
============================== */

bookButton.addEventListener(
  "click",
  async () => {

    const name =
      nameInput.value.trim();


    if(!name){

      message.className =
        "message error";

      message.textContent =
        "Inserisci il tuo nome.";

      return;

    }


    if(!selectedDate){

      message.className =
        "message error";

      message.textContent =
        "Scegli un giorno.";

      return;

    }


    if(!selectedTime){

      message.className =
        "message error";

      message.textContent =
        "Scegli un orario.";

      return;

    }


    bookButton.disabled =
      true;


    message.className =
      "message";

    message.textContent =
      "Prenotazione in corso...";


    const { error } =
      await supabaseClient
        .from("prenotazioni")
        .insert({

          nome:name,

          persona:
            selectedPerson,

          data:
            selectedDate,

          orario:
            selectedTime

        });


    if(error){

      console.error(error);

      message.className =
        "message error";


      if(
        error.code ===
        "23505"
      ){

        message.textContent =
          "❌ Questo orario è appena stato prenotato.";

      }
      else{

        message.textContent =
          "❌ Errore. Riprova.";

      }


      loadTimes();

      return;

    }


  message.className =
  "message success";

const formattedDate =
  new Date(selectedDate + "T00:00:00")
    .toLocaleDateString("it-IT", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });

const whatsappNumber =
  selectedPerson === "Matteo"
    ? "393201519469"
    : "393274454796";

const whatsappMessage =
  `Ciao! Sono ${name}, ho appena prenotato ` +
  `un appuntamento da 𝑴𝑬𝑻𝑻&𝑻𝑶𝑴𝑴 𝑩𝑨𝑹𝑩𝑬𝑹.\n\n` +
  `✂️ Barbiere: ${selectedPerson}\n` +
  `📅 ${formattedDate}\n` +
  `🕐 Ore ${selectedTime}`;

const whatsappLink =
  "https://wa.me/" +
  whatsappNumber +
  "?text=" +
  encodeURIComponent(whatsappMessage);

message.innerHTML = `

  <div style="
    background:#292929;
    border:1px solid #444;
    border-radius:16px;
    padding:18px;
    margin-top:15px;
  ">

    <div style="
      font-size:20px;
      margin-bottom:12px;
    ">
      ✅ PRENOTAZIONE CONFERMATA
    </div>

    <div style="
      color:#ddd;
      line-height:1.8;
      margin-bottom:15px;
    ">

      ✂️ <strong>${selectedPerson}</strong><br>

      📅 ${formattedDate}<br>

      🕐 Ore <strong>${selectedTime}</strong>

    </div>

    <a
      href="${whatsappLink}"
      target="_blank"
      style="
        display:block;
        background:#25D366;
        color:white;
        text-decoration:none;
        padding:14px;
        border-radius:12px;
        font-weight:bold;
        text-align:center;
      "
    >
      📱 CONFERMA SU WHATSAPP
    </a>

  </div>

`;


nameInput.value =
  "";

selectedTime =
  null;

loadTimes();

  }
);


/* ==============================
   AVVIO
============================== */

const today =
  new Date();

selectedDate =
  dateString(today);

renderDays();

loadTimes();

</script>

</body>
</html>
