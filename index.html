<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prenota il tuo barbiere</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 20px 15px 50px;
}

.hero {
  text-align: center;
  padding: 25px 10px 20px;
}

.logo {
  width: 75px;
  height: 75px;
  margin: auto;
  border-radius: 50%;
  background: #c9a45c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
}

.hero h1 {
  font-size: 32px;
  margin: 15px 0 5px;
}

.hero p {
  color: #bbb;
  margin: 0;
}

.card {
  background: #1d1d1d;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 22px;
  margin-top: 15px;
}

.step {
  margin-bottom: 25px;
}

.step-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

.people {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.person {
  border: 2px solid #444;
  background: #242424;
  color: white;
  border-radius: 15px;
  padding: 18px 10px;
  text-align: center;
  cursor: pointer;
  transition: .2s;
}

.person:hover {
  border-color: #c9a45c;
}

.person.selected {
  border-color: #c9a45c;
  background: #332c20;
}

.person-name {
  font-size: 20px;
  font-weight: bold;
}

.person-sub {
  color: #aaa;
  font-size: 13px;
  margin-top: 5px;
}

input {
  width: 100%;
  padding: 15px;
  background: #292929;
  border: 1px solid #444;
  color: white;
  border-radius: 12px;
  font-size: 16px;
}

input:focus {
  outline: none;
  border-color: #c9a45c;
}

.date-box {
  position: relative;
}

.date-box input {
  color-scheme: dark;
}

.times {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.time {
  padding: 13px 5px;
  background: #292929;
  border: 1px solid #444;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  font-weight: bold;
}

.time:hover {
  border-color: #c9a45c;
}

.time.selected {
  background: #c9a45c;
  border-color: #c9a45c;
  color: #111;
}

.time.occupied {
  background: #151515;
  color: #555;
  border-color: #222;
  cursor: not-allowed;
  text-decoration: line-through;
}

.time.loading {
  opacity: .5;
}

button.book {
  width: 100%;
  padding: 17px;
  border: 0;
  border-radius: 14px;
  background: #c9a45c;
  color: #111;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

button.book:hover {
  background: #dfbc72;
}

button.book:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

.success {
  color: #62d17d;
}

.error {
  color: #ff6d6d;
}

.info {
  color: #aaa;
  text-align: center;
  font-size: 14px;
}

.hidden {
  display: none;
}

.footer {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 25px;
}

@media(max-width:500px) {
  .times {
    grid-template-columns: repeat(2, 1fr);
  }

  .hero h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">

    <div class="logo">✂️</div>

    <h1>Prenota il tuo appuntamento</h1>

    <p>Taglio, stile e precisione.</p>

  </div>


  <div class="card">

    <!-- PERSONA -->

    <div class="step">

      <div class="step-title">
        1. Scegli il barbiere
      </div>

      <div class="people">

        <div
          class="person selected"
          data-person="Matteo"
        >

          <div class="person-name">
            Matteo
          </div>

          <div class="person-sub">
            Barbiere
          </div>

        </div>


        <div
          class="person"
          data-person="Tommaso"
        >

          <div class="person-name">
            Tommaso
          </div>

          <div class="person-sub">
            Barbiere
          </div>

        </div>

      </div>

    </div>


    <!-- NOME -->

    <div class="step">

      <div class="step-title">
        2. Il tuo nome
      </div>

      <input
        id="name"
        type="text"
        maxlength="80"
        placeholder="Nome e cognome"
      >

    </div>


    <!-- DATA -->

    <div class="step">

      <div class="step-title">
        3. Scegli il giorno
      </div>

      <div class="date-box">

        <input
          id="date"
          type="date"
        >

      </div>

    </div>


    <!-- ORARIO -->

    <div class="step">

      <div class="step-title">
        4. Scegli l'orario
      </div>

      <div
        id="times"
        class="times"
      ></div>

      <p
        id="timeInfo"
        class="info"
      >
        Scegli una data per vedere gli orari disponibili.
      </p>

    </div>


    <button
      id="bookButton"
      class="book"
      disabled
    >
      PRENOTA ORA
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <div class="footer">
    Prenotazione online ✂️
  </div>

</div>


<script>

const SUPABASE_URL =
  "https://nieyajttmfkxowwjqglb.supabase.co";


/*
  INCOLLA QUI LA STESSA PUBLISHABLE KEY
  CHE HAI GIÀ USATO NELLA VERSIONE PRECEDENTE.
*/

const SUPABASE_KEY =
  "sb_publishable_9ShmvYVhOPGoU90-Lkwdvw_BVy3dz_X";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let selectedPerson = "Matteo";
let selectedTime = null;


/*
  ORARI DISPONIBILI

  Puoi modificarli facilmente.
*/

const TIMES = [
  "09:00",
  "09:30",
  "10:00",
  "10:30",
  "11:00",
  "11:30",
  "12:00",

  "14:00",
  "14:30",
  "15:00",
  "15:30",
  "16:00",
  "16:30",
  "17:00",
  "17:30",
  "18:00",
  "18:30",
  "19:00"
];


/* DATA MINIMA */

const dateInput =
  document.getElementById("date");

const today =
  new Date();

const todayString =
  today.toISOString().split("T")[0];

dateInput.min = todayString;


/* SELEZIONE BARBIERE */

document
  .querySelectorAll(".person")
  .forEach(person => {

    person.addEventListener("click", () => {

      document
        .querySelectorAll(".person")
        .forEach(p =>
          p.classList.remove("selected")
        );

      person.classList.add("selected");

      selectedPerson =
        person.dataset.person;

      selectedTime = null;

      loadTimes();

    });

  });


/* CAMBIO DATA */

dateInput.addEventListener(
  "change",
  () => {

    selectedTime = null;

    loadTimes();

  }
);


/* CARICA ORARI */

async function loadTimes() {

  const times =
    document.getElementById("times");

  const info =
    document.getElementById("timeInfo");

  const bookButton =
    document.getElementById("bookButton");


  bookButton.disabled = true;

  times.innerHTML = "";

  selectedTime = null;


  if (!dateInput.value) {

    info.textContent =
      "Scegli una data per vedere gli orari disponibili.";

    return;

  }


  info.textContent =
    "Controllo disponibilità...";


  /*
    Recuperiamo solamente gli orari occupati.

    NON vengono mostrati nomi o dati dei clienti.
  */

  const { data, error } =
    await supabaseClient
      .rpc(
        "get_booked_slots",
        {
          p_persona: selectedPerson,
          p_data: dateInput.value
        }
      );


  if (error) {

    console.error(error);

    info.className =
      "info error";

    info.textContent =
      "Errore nel caricamento degli orari.";

    return;

  }


  const occupied =
    (data || []).map(
      x => x.orario.substring(0, 5)
    );


  TIMES.forEach(time => {

    const button =
      document.createElement("div");

    button.className = "time";

    button.textContent = time;


    if (occupied.includes(time)) {

      button.classList.add("occupied");

      button.textContent =
        time + " • occupato";

    } else {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".time")
            .forEach(t =>
              t.classList.remove("selected")
            );

          button.classList.add("selected");

          selectedTime = time;

          bookButton.disabled = false;

        }
      );

    }


    times.appendChild(button);

  });


  const available =
    TIMES.filter(
      time => !occupied.includes(time)
    );


  if (available.length === 0) {

    info.className =
      "info error";

    info.textContent =
      "Nessun orario disponibile per questo giorno.";

  } else {

    info.className =
      "info";

    info.textContent =
      "Scegli uno degli orari disponibili.";

  }

}


/* PRENOTAZIONE */

document
  .getElementById("bookButton")
  .addEventListener(
    "click",
    async () => {

      const name =
        document
          .getElementById("name")
          .value
          .trim();

      const message =
        document.getElementById("message");

      const bookButton =
        document.getElementById("bookButton");


      if (!name) {

        message.className =
          "message error";

        message.textContent =
          "Inserisci il tuo nome.";

        return;

      }


      if (!dateInput.value) {

        message.className =
          "message error";

        message.textContent =
          "Scegli una data.";

        return;

      }


      if (!selectedTime) {

        message.className =
          "message error";

        message.textContent =
          "Scegli un orario.";

        return;

      }


      bookButton.disabled = true;

      message.className =
        "message";

      message.textContent =
        "Prenotazione in corso...";


      const { error } =
        await supabaseClient
          .from("prenotazioni")
          .insert({
            nome: name,
            persona: selectedPerson,
            data: dateInput.value,
            orario: selectedTime
          });


      if (error) {

        console.error(error);

        message.className =
          "message error";


        if (error.code === "23505") {

          message.textContent =
            "❌ Questo orario è appena stato prenotato. Scegline un altro.";

        } else {

          message.textContent =
            "❌ Non è stato possibile completare la prenotazione.";

        }


        loadTimes();

        return;

      }


      message.className =
        "message success";

      message.textContent =
        "✅ Prenotazione effettuata! Ti aspettiamo.";


      document
        .getElementById("name")
        .value = "";


      selectedTime = null;


      loadTimes();

    }
  );


</script>

</body>
</html>
